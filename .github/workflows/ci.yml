name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, pegas-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Pull request workflows otherwise test GitHub's synthetic merge
          # commit, which cannot be bound to an immutable Pegas Candidate.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Verify preinstalled credential isolation backend
        id: isolation
        run: command -v bwrap
      - id: check
        run: pnpm check
      - id: smoke
        run: pnpm smoke
      - name: Verify DSH model authentication over loopback
        id: dsh_auth
        run: npm exec --yes --package=@deepseek-ai/dsh@0.2.2-rc.5 -- pnpm smoke:dsh-auth
      - name: Verify real DSH boot, tool and resume inside Electron
        id: dsh_runtime
        run: npm exec --yes --package=@deepseek-ai/dsh@0.2.2-rc.5 -- pnpm smoke:dsh-runtime
      - name: Verify credential isolation with real DSH
        id: credentials
        run: npm exec --yes --package=@deepseek-ai/dsh@0.2.2-rc.5 -- pnpm smoke:credential-boundary
      - name: Detect UI changes
        id: changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- web; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
          else
            echo "ui=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install review browser
        if: github.event_name == 'pull_request' && steps.changed.outputs.ui == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture temporary UI review media
        if: github.event_name == 'pull_request' && steps.changed.outputs.ui == 'true'
        run: pnpm review:ui -- --changed-from "origin/${{ github.base_ref }}"
      - name: Verify desktop command authorization reuse and revocation
        id: commands
        run: xvfb-run --auto-servernum npm exec --yes --package=@deepseek-ai/dsh@0.2.2-rc.5 -- pnpm smoke:command-authorization
      - name: Detect external-service changes
        id: external
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src/model src/speech src/notification services; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect redacted real-service canary
        if: github.event_name == 'pull_request' && steps.external.outputs.changed == 'true'
        run: pnpm review:canary -- --changed-from "origin/${{ github.base_ref }}"
      - name: Generate temporary review evidence
        if: github.event_name == 'pull_request'
        env:
          REVIEW_FEATURE_IDS: ${{ github.event.pull_request.title }}
          REVIEW_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          pnpm review:evidence --
          --changed-from "origin/${{ github.base_ref }}"
          --artifacts-dir output/feature-review/media
          --passed "pnpm check|format, lint, types, dead code, coverage and build passed"
          --passed "pnpm smoke|isolated end-to-end smoke passed"
          --passed "pnpm smoke:dsh-auth|real DSH model authentication passed over loopback"
      - name: Add review evidence to the job summary
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f output/feature-review/summary.md ]; then
            cat output/feature-review/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain evidence on the self-hosted machine
        if: always()
        env:
          PEGAS_CI_STEPS: ${{ toJSON(steps) }}
          PEGAS_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/archive-ci-evidence.ts

  credential-boundary-macos:
    runs-on: [self-hosted, macOS, ARM64, pegas-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: install
        run: pnpm install --frozen-lockfile
      - id: credential_tests
        run: pnpm exec vitest run test/credential-boundary.test.ts
      - id: build
        run: pnpm build:server
      - name: Verify real Keychain and credential isolation
        id: keychain
        run: npm exec --yes --package=@deepseek-ai/dsh@0.2.2-rc.5 -- pnpm smoke:credential-boundary
      - name: Retain evidence on the self-hosted machine
        if: always()
        env:
          PEGAS_CI_STEPS: ${{ toJSON(steps) }}
          PEGAS_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/archive-ci-evidence.ts
